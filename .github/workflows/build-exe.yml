name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Build EXE
        shell: pwsh
        run: ./build.ps1

      - name: Smoke test (module imports and resume generates)
        shell: pwsh
        run: python -c "from resume_builder import build_resume; assert build_resume({'name':'CI Test'}).getbuffer().nbytes > 0"

      - uses: actions/upload-artifact@v7
        with:
          name: DynamicResumeBuilder-windows
          path: dist/DynamicResumeBuilder.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DynamicResumeBuilder.exe

